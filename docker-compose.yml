version: '3.8'

services:
  # Base de datos PostgreSQL dedicada para ExposureIQ
  postgres:
    image: postgres:16-alpine
    container_name: exposureiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exposureiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/20260908000001_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/migrations/20260908000002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - exposureiq-net

  # API Principal en Rust (Axum + SQLx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exposureiq-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/exposureiq_db?sslmode=disable
      WORKER_BASE_URL: http://workers:8001
      WAHA_BASE_URL: http://host.docker.internal:3000
      WAHA_SESSION: default
      DIRECTOR_WHATSAPP_PHONE: ${DIRECTOR_WHATSAPP_PHONE:-}
      KAPSO_API_KEY: ${KAPSO_API_KEY:-}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads
    networks:
      - exposureiq-net

  # Workers Python (Surya OCR Client, Síntesis Claude LLM, Motor OSINT)
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: exposureiq-workers
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/exposureiq_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SURYA_OCR_URL: http://host.docker.internal:5000/ocr
      DIRECTOR_WHATSAPP_PHONE: ${DIRECTOR_WHATSAPP_PHONE:-}
      LIGHTPANDA_CDP_URL: http://lightpanda:9222
    ports:
      - "127.0.0.1:8181:8001"
    depends_on:
      - postgres
      - lightpanda
    volumes:
      - uploads_data:/app/uploads
    networks:
      - exposureiq-net

  # Headless Browser Lightpanda (Ultra liviano, motor Zig con soporte CDP)
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: exposureiq-lightpanda
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:9222"
    networks:
      - exposureiq-net

  # Frontend Next.js 15 (Plantilla Trezo)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exposureiq-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8180/api}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - backend
    networks:
      - exposureiq-net

volumes:
  postgres_data:
  uploads_data:

networks:
  exposureiq-net:
    driver: bridge
